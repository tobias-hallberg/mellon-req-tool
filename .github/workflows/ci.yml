name: CI

# Runs on pull requests and when something lands on main or develop. "Run
# workflow" on the Actions tab starts it by hand.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: mellon

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libfontconfig1 libdbus-1-3

      - name: Configure git identity (tests create commits)
        run: |
          git config --global user.name "Mellon CI"
          git config --global user.email "ci@mellon.invalid"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      # The PDF program the installer bundles (packaging/build.ps1), so the
      # tests that read an exported PDF run instead of skipping. Linux only:
      # the Windows job keeps them skipped to stay inside its time limit.
      - name: Install the PDF program
        if: runner.os == 'Linux'
        env:
          TECTONIC_VERSION: "0.17.0"
          TECTONIC_SHA256: 8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tectonic.tar.gz" \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${TECTONIC_SHA256}  $RUNNER_TEMP/tectonic.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tectonic"
          tar xzf "$RUNNER_TEMP/tectonic.tar.gz" -C "$RUNNER_TEMP/tectonic"
          echo "MELLON_TECTONIC=$RUNNER_TEMP/tectonic/tectonic" >> "$GITHUB_ENV"

      - name: Cache the PDF program's TeX files
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/.cache/Tectonic
          key: tectonic-0.17.0-${{ runner.os }}

      # One export first, alone, so the parallel tests don't all fetch the
      # same TeX files into an empty cache at once.
      - name: Warm the PDF program's cache
        if: runner.os == 'Linux'
        run: uv run --no-sync pytest -q tests/test_export.py::test_pdf_compiles_for_fixture_doc

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          MELLON_REQUIRE_FIXTURE: "1"
        # One worker per CPU: the suite takes about 30 minutes in one process.
        run: uv run --no-sync pytest -q -rs -n auto

  check:
    # Fails on any load error, validation error, or suspect or broken link in
    # this repo's own documents. Suspect detection needs the full history.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mellon

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check documents
        run: uv run --no-sync mellon-check --repo-root ..

  wheel-smoke:
    # Installs the built wheel WITHOUT uv.lock, the way `uv tool install`
    # does, so an unbounded dependency that breaks a fresh install fails here.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mellon

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Build wheel
        run: uv build --wheel --out-dir "$RUNNER_TEMP/dist"

      - name: Install wheel into a fresh venv
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" "$RUNNER_TEMP"/dist/*.whl

      - name: Smoke-test entry points
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          "$RUNNER_TEMP/venv/bin/mellon-mcp" --version
          "$RUNNER_TEMP/venv/bin/mellon-gui" --version
          "$RUNNER_TEMP/venv/bin/mellon-check" --version
          "$RUNNER_TEMP/venv/bin/python" -c "import mellon.mcp.server, mellon.gui.main_window"
